name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AutoClicker.apk

      - uses: actions/upload-artifact@v5
        with:
          name: AutoClicker-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Auto Clicker (latest)
          make_latest: true
          files: app/build/outputs/apk/debug/AutoClicker.apk
